<!DOCTYPE html>
<html lang="zh-TW">

    <head>
        <!--基礎設置-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--這裡中間會是分頁上方的字-->
        <title>遊戲網站</title>

        <!--導入css-->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        
        <!--上方導覽列 -->
        <header>
            <!--logo-->
            <div class="logo">
                <a href="index.html">
                    <img src="./images/logo.jpg" alt="logo">
                </a>
            </div>

            <!--漢堡選單按鈕-->>
            <button class="menu-button" id="menu-button">
                ☰
            </button>

            <!--選單內容-->
            <nav id="main-nav">
                <a href="index.html">首頁</a>
                <a href="about.html">介紹</a>
                <a href="character.html">角色</a>
                <a href="story.html">世界觀</a>
            </nav>

        </header>

        <!--首頁-->
        <main>

            <!--主要顯示區(第一印象)-->
            <section class="hero">

                <div class="hero-image">
                    <img src="./images/home/hero-img.png" alt="主圖片">
                </div>

                <h1>
                    長得像學妹的學弟<br>
                    和長得像學長的學姐
                </h1>

                <p>遊戲標語</p>

                <div class="scroll-down">下滑查看更多</div>

            </section>

            <!--公告-->
            <section class="news">

                <div class="section-title">
                    <h2>NEWS</h2>
                    <p>最新消息</p>
                </div>

                <!--公告顯示-->
                <div class="news-carousel">

                    <!--左按鈕-->
                    <button class="news-button" id="news-prev">
                        ◀
                    </button>

                    <!--公告內容-->
                    <div class="news-window">

                        <div class="news-list">

                            <!--公告1-->
                            <article class="news-card">

                                <div class="image-placeholder">
                                    <img src="./images/home/news-test01.jpg" alt="公告圖片1">                               
                                </div>

                                <h3>公告1標題預留</h3>

                                <p class="news-date">2026.xx.xx</p>

                            </article>

                            <!--公告2-->
                            <article class="news-card">

                                <div class="image-placeholder">
                                    <img src="./images/home/news-test02.jpg" alt="公告圖片2">
                                </div>

                                <h3>公告2標題預留</h3>

                                <p class="news-date">2026.xx.xx</p>

                            </article>

                            <!--公告3-->
                            <article class="news-card">

                                <div class="image-placeholder">
                                    <img src="./images/home/news-test01.jpg" alt="公告圖片3">
                                </div>

                                <h3>公告3標題預留</h3>

                                <p class="news-date">2026.xx.xx</p>

                            </article>

                            <!--公告4-->
                            <article class="news-card">

                                <div class="image-placeholder">
                                    <img src="./images/home/news-test02.jpg" alt="公告圖片4">
                                </div>

                                <h3>公告4標題預留</h3>

                                <p class="news-date">2026.xx.xx</p>

                            </article>

                            <!--公告5-->
                            <article class="news-card">

                                <div class="image-placeholder">
                                    <img src="./images/home/news-test01.jpg" alt="公告圖片5">
                                </div>

                                <h3>公告5標題預留</h3>

                                <p class="news-date">2026.xx.xx</p>

                            </article>

                            <!--公告6-->
                            <article class="news-card">

                                <div class="image-placeholder">
                                    <img src="./images/home/news-test02.jpg" alt="公告圖片6">
                                </div>

                                <h3>公告6標題預留</h3>

                                <p class="news-date">2026.xx.xx</p>

                            </article>

                        </div>
                    </div>

                    <button class="news-button" id="news-next">
                        ▶
                    </button>

                </div>
                
            </section>

            <!--下載-->
            <section class="download">

                <!--下載內容-->
                <div class="section-list">

                    <a class="download-card" href="#" target="_blank">

                        <div class="download-icon">
                            PC
                        </div>

                        <div class="download-info">
                            <h3>Windows</h3>
                            <p>遊戲下載</p>
                        </div>

                    </a>

                    <a class="download-card" href="#" target="_blank">

                        <div class="download-icon">
                            STEAM
                        </div>

                        <div class="download-icon">
                            <h3>Steam</h3>
                            <p>商店葉面</p>
                        </div>

                    </a>

                </div>
                
            </section>

        </main>

        <!--頁底-->
        <footer>

            <!--社群-->
            <div class="social-links">

                <a href="#" target="_blank">dc</a>
                <a href="#" target="_blank">yt</a>
                <a href="https://www.instagram.com/reverse_senpai404?stkn=MWNvcHlrZG5kcXJsaA%3D%3D&utm_source=qr" target="_blank">ig</a>
                <a href="#" target="_blank">X</a>

            </div>

            <p> 長得像學妹的學弟和長得像學長的學姐 </p>

        </footer>

        <!--導入js-->
        <script src="js/main.js"></script>
    
    </body>

</html>
