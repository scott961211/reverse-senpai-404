<!DOCTYPE html>
<html lang="zh-TW">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>遊戲網站</title><!--這裡中間會是分頁上方的字-->

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        
        <!--上方導覽列 -->
        <header>
            <!--logo-->
            <div class="logo">
                <a href="index.html">
                    <img src="./images/logo.jpg" alt="logo">
                </a>
            </div>

            <button class="menu-button" id="menu-button">
                ☰
            </button>

            <nav id="main-nav">
                <a href="index.html">首頁</a>
                <a href="about.html">介紹</a>
                <a href="character.html">角色</a>
                <a href="story.html">世界觀</a>
            </nav>

        </header>

        <!--主要區域-->
        <main class="character-page">

            <section class="main-charaters">

                <div class="section-title">
                    <h1>MAIN CHARACTERS</h1>
                    <p>主要角色</p>
                </div>
                
                <div class="character-carousel">

                    <button id="character-prev" class="character-button">
                        ❮
                    </button>

                    <div class="character-stage" id="character-stage">
                        <!--js自動-->
                    </div>

                    <button id="character-next" class="character-button">
                        ❯
                    </button>

                </div>

                <div class="character-info">
                    <h2 id="character-name"></h2>
                    <p id="character-description"></p>
                </div>

            </section>

            <section class="side-characters">

                <div class="section-title">
                    <h2>SIDE CHARACTERS</h2>
                    <p>其他角色</p>
                </div>

                <div class="side-characters-list">

                    <div class="side-character-card">
                        <div class="side-character-image">配角 A</div>
                        <h3>配角 A</h3>
                    </div>

                    <div class="side-character-card">
                        <div class="side-character-image">配角 B</div>
                        <h3>配角 B</h3>
                    </div>

                    <div class="side-character-card">
                        <div class="side-character-image">配角 C</div>
                        <h3>配角 C</h3>
                    </div>

                    <div class="side-character-card">
                        <div class="side-character-image">配角 D</div>
                        <h3>配角 D</h3>
                    </div>

                    <div class="side-character-card">
                        <div class="side-character-image">配角 E</div>
                        <h3>配角 E</h3>
                    </div>

                    <div class="side-character-card">
                        <div class="side-character-image">配角 F</div>
                        <h3>配角 F</h3>
                    </div>

                    <div class="side-character-card">
                        <div class="side-character-image">配角 G</div>
                        <h3>配角 G</h3>
                    </div>

                    <div class="side-character-card">
                        <div class="side-character-image">配角 H</div>
                        <h3>配角 H</h3>
                    </div>

                </div>

            </section>

        </main>
    
        <!--頁底-->
        <footer>

            <div class="social-links">

                <a href="https://discord.gg/ztVHWFdPF4" target="_blank">dc</a>
                <a href="https://www.instagram.com/reverse_senpai404?stkn=MWNvcHlrZG5kcXJsaA%3D%3D&utm_source=qr" target="_blank">ig</a>

            </div>

            <p> 長得像學妹的學弟和長得像學長的學姐 </p>

        </footer>

        <script src="js/main.js"></script>
        
    </body>

</html>
